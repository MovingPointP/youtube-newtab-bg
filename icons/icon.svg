<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Lumelo のアイコン（DESIGN.md 6-5）。PNG は scripts/build-icons.mjs で作る -->
  <defs>
    <clipPath id="clip"><rect width="128" height="128" rx="28"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="128" height="128" fill="#241d3a"/>
    <g filter="url(#blur)">
      <circle cx="40" cy="38" r="30" fill="#f2a65a"/>
      <circle cx="96" cy="50" r="28" fill="#5f7fd6"/>
      <circle cx="70" cy="100" r="30" fill="#c26aa6"/>
    </g>
    <rect x="16" y="82" width="64" height="28" rx="9" fill="#0e1120" fill-opacity="0.75"/>
    <rect x="25" y="93" width="38" height="6" rx="3" fill="#fff"/>
  </g>
</svg>
