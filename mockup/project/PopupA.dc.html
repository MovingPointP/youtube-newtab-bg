<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ポップアップ A</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
input[type=range]{accent-color:#2b5fd9}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #ffffff; font-family: system-ui, 'Segoe UI', 'Yu Gothic UI', 'Hiragino Sans', sans-serif; color: #1d2129; font-size: 13px; display: flex; flex-direction: column">
<div style="padding: 14px 18px; border-bottom: 1px solid #e6e8ec; font-size: 14px; font-weight: 700">[拡張の名前]</div>
<div style="padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #e6e8ec">
<div style="font-size: 12px; font-weight: 700; color: #545b66">プレイリスト</div>
<div style="padding: 10px 12px; border-radius: 8px; background: #f3f5f8; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; color: #5f6672">登録中</span>
<span style="font-weight: 600">[プレイリスト名]</span>
</div>
<button type="button" style="height: 40px; border: 0; border-radius: 8px; background: #1d2129; color: #ffffff; font: inherit; font-weight: 600; cursor: pointer">このプレイリストを使う</button>
<div style="font-size: 11px; color: #5f6672; text-align: center">または URL を貼り付け</div>
<div style="display: flex; gap: 8px">
<label style="flex: 1; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">プレイリストの URL</span><input type="url" placeholder="https://www.youtube.com/playlist?list=…" style="flex: 1; min-width: 0; height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid #c9ced6; border-radius: 8px; font: inherit; font-size: 12px"></label>
<button type="button" style="height: 36px; padding: 0 14px; border: 1px solid #c9ced6; border-radius: 8px; background: #ffffff; color: #1d2129; font: inherit; font-weight: 600; cursor: pointer">登録</button>
</div>
</div>
<div style="padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #e6e8ec">
<div style="font-size: 12px; font-weight: 700; color: #545b66">再生順</div>
<div role="radiogroup" aria-label="再生順" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 3px; border-radius: 8px; background: #eef0f3">
<label style="height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #ffffff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); font-weight: 600; cursor: pointer"><input type="radio" name="order-a" checked style="position: absolute; opacity: 0">シャッフル</label>
<label style="height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: #545b66; cursor: pointer"><input type="radio" name="order-a" style="position: absolute; opacity: 0">連続再生</label>
</div>
</div>
<div style="padding: 16px 18px; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 12px; font-weight: 700; color: #545b66">背景の見た目</div>
<label style="display: grid; grid-template-columns: 48px minmax(0, 1fr) 36px; align-items: center; gap: 10px"><span>ぼかし</span><input type="range" min="0" max="40" value="16"><span style="text-align: right; color: #5f6672">16</span></label>
<label style="display: grid; grid-template-columns: 48px minmax(0, 1fr) 36px; align-items: center; gap: 10px"><span>暗さ</span><input type="range" min="0" max="80" value="35"><span style="text-align: right; color: #5f6672">35%</span></label>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
