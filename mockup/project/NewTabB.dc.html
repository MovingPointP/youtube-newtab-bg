<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>新しいタブ B-2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#ffffff}a:hover{color:#dfe6ef}
.video{position:absolute;inset:-60px;background:
radial-gradient(circle at 22% 30%,#3b6f8f 0,transparent 42%),
radial-gradient(circle at 70% 25%,#c98a4b 0,transparent 38%),
radial-gradient(circle at 55% 75%,#5a3f6b 0,transparent 45%),
radial-gradient(circle at 90% 85%,#2e5b4a 0,transparent 40%),
#1b2430}
.vol{accent-color:#ffffff}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; font-family: system-ui, 'Segoe UI', 'Yu Gothic UI', 'Hiragino Sans', sans-serif; color: #ffffff">
<div class="video" style="filter: blur({{blur}}px)"></div>
<div style="position: absolute; inset: 0; background: rgba(0, 0, 0, {{dim}})"></div>
<div style="position: absolute; left: 40px; bottom: 40px; max-width: 640px; display: flex; align-items: center; gap: 6px; padding: 6px 22px 6px 6px; border-radius: 999px; background: rgba(14, 16, 22, {{panel}}); backdrop-filter: blur(12px)">
<div onMouseEnter="{{showVol}}" onMouseLeave="{{hideVol}}" onFocus="{{showVol}}" onBlur="{{hideVol}}" style="display: flex; align-items: center">
<button type="button" aria-label="ミュート解除" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, 0.12); color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"></path><path d="m22 9-6 6"></path><path d="m16 9 6 6"></path></svg>
</button>
<label style="display: flex; align-items: center; overflow: hidden; width: {{volWidth}}px; opacity: {{volOpacity}}; transition: width 0.2s ease, opacity 0.2s ease"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">音量</span><input class="vol" type="range" min="0" max="100" value="40" style="width: 110px; margin: 0 0 0 12px"></label>
</div>
<a href="https://www.youtube.com/" style="margin-left: 10px; font-size: 16px; font-weight: 600; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[動画のタイトル]</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"blur":{"editor":"range","min":0,"max":40,"step":1,"unit":"px","default":16,"section":"背景"},"dim":{"editor":"range","min":0,"max":0.8,"step":0.05,"default":0.35,"section":"背景"},"panel":{"editor":"range","min":0,"max":0.9,"step":0.05,"default":0.55,"section":"パネル"},"forceVol":{"editor":"boolean","default":false,"section":"パネル"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { hover: false };
}
renderVals() {
var open = this.state.hover || (this.props.forceVol ?? false);
return {
blur: this.props.blur ?? 16,
dim: this.props.dim ?? 0.35,
panel: this.props.panel ?? 0.55,
volWidth: open ? 128 : 0,
volOpacity: open ? 1 : 0,
showVol: () => this.setState({ hover: true }),
hideVol: () => this.setState({ hover: false })
};
}
}
</script>
</body>
</html>
