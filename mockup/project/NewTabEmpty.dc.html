<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>未登録・エラー時の新しいタブ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #16181d; font-family: system-ui, 'Segoe UI', 'Yu Gothic UI', 'Hiragino Sans', sans-serif; color: #e8eaef; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#9aa3b2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m10 9.5 4.5 2.5-4.5 2.5z"></path></svg>
<div style="font-size: 20px; font-weight: 600">{{heading}}</div>
<div style="font-size: 15px; color: #a9b1bf; line-height: 1.7">{{body}}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["未登録","オフライン","再生できない"],"default":"未登録"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
var texts = {
'未登録': ['プレイリストが登録されていません', 'ツールバーの拡張アイコンから、プレイリストを登録してください'],
'オフライン': ['オフラインです', 'インターネットにつながると、再生が始まります'],
'再生できない': ['プレイリストを再生できません', '削除されたか、非公開になっている可能性があります。ツールバーの拡張アイコンから登録し直してください']
};
var t = texts[this.props.state ?? '未登録'] || texts['未登録'];
return { heading: t[0], body: t[1] };
}
}
</script>
</body>
</html>
