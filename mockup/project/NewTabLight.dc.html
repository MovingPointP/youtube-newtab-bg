<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>新しいタブ B-1（白）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#14161b}a:hover{color:#3a3f4a}
.video{position:absolute;inset:-60px;background:
radial-gradient(circle at 22% 30%,#3b6f8f 0,transparent 42%),
radial-gradient(circle at 70% 25%,#c98a4b 0,transparent 38%),
radial-gradient(circle at 55% 75%,#5a3f6b 0,transparent 45%),
radial-gradient(circle at 90% 85%,#2e5b4a 0,transparent 40%),
#1b2430}
.vol{accent-color:#14161b}
.marquee{display:inline-block;white-space:nowrap;animation:marquee 12s linear infinite}
@keyframes marquee{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(min(0px,calc(480px - 100%)))}}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; font-family: system-ui, 'Segoe UI', 'Yu Gothic UI', 'Hiragino Sans', sans-serif; color: #ffffff">
<div class="video" style="filter: blur({{blur}}px)"></div>
<div style="position: absolute; inset: 0; background: rgba(0, 0, 0, {{dim}})"></div>
<div style="position: absolute; left: 40px; bottom: 40px; max-width: 480px; display: flex; flex-direction: column; gap: 12px; padding: 18px 20px 14px; border-radius: 16px; background: rgba(255, 255, 255, {{panel}}); color: #14161b; backdrop-filter: blur(12px)">
<div style="overflow: hidden">
<a class="marquee" href="https://www.youtube.com/" style="font-size: 22px; font-weight: 700; line-height: 1.35; text-decoration: none">{{title}}</a>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" aria-label="ミュート解除" style="width: 44px; height: 44px; margin-left: -8px; border-radius: 50%; border: 0; background: transparent; color: #14161b; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"></path><path d="m22 9-6 6"></path><path d="m16 9 6 6"></path></svg>
</button>
<label style="display: flex; align-items: center"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">音量</span><input class="vol" type="range" min="0" max="100" value="40" style="width: 160px"></label>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"blur":{"editor":"range","min":0,"max":40,"step":1,"unit":"px","default":16,"section":"背景"},"dim":{"editor":"range","min":0,"max":0.8,"step":0.05,"default":0.35,"section":"背景"},"panel":{"editor":"range","min":0,"max":0.9,"step":0.05,"default":0.75,"section":"パネル"},"longTitle":{"editor":"boolean","default":true,"section":"パネル"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
var long = this.props.longTitle ?? true;
return {
blur: this.props.blur ?? 16,
dim: this.props.dim ?? 0.35,
panel: this.props.panel ?? 0.75,
title: long ? '[長い動画のタイトル] パネルの幅に収まらないときは、左へゆっくりスクロールして、端まで行ったら最初に戻る' : '[動画のタイトル]'
};
}
}
</script>
</body>
</html>
