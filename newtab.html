<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>新しいタブ</title>
  <style>
    :root {
      /* 後でポップアップの設定に置き換える（DESIGN.md 4-4） */
      --blur: 16px;
      --dim: 0.35;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    /* 16:9 の動画で画面を覆う（DESIGN.md 4-2）。ぼかしで端が透けないよう、ぼかしの分だけ大きくする */
    #player iframe {
      position: fixed;
      top: 50%;
      left: 50%;
      width: calc(max(100vw, 100vh * 16 / 9) + var(--blur) * 4);
      height: calc(max(100vh, 100vw * 9 / 16) + var(--blur) * 4);
      transform: translate(-50%, -50%);
      border: 0;
      filter: blur(var(--blur));
      pointer-events: none; /* YouTube のタイトルやボタンを出さない（DESIGN.md 4-3） */
    }
    #dim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, var(--dim));
    }
    /* 動画名と音量のパネル（DESIGN.md 4-1a） */
    #panel {
      position: fixed;
      left: 40px;
      bottom: 40px;
      max-width: 280px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 18px 20px 14px;
      border-radius: 16px;
      background: rgba(14, 16, 22, 0.55);
      backdrop-filter: blur(12px);
      color: #fff;
      font-family: system-ui, 'Segoe UI', 'Yu Gothic UI', 'Hiragino Sans', sans-serif;
    }
    #panel[hidden] { display: none; }
    #title-box { overflow: hidden; }
    #title {
      display: inline-block;
      white-space: nowrap;
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.35;
      text-decoration: none;
    }
    #title:hover { color: #dfe6ef; }
    /* 収まらない動画名を流す（DESIGN.md 4-1b）。--shift と --duration は newtab.js が入れる */
    #title.scrolling { animation: marquee var(--duration) linear infinite; }
    @keyframes marquee {
      0%, 15% { transform: translateX(0); }
      85%, 100% { transform: translateX(var(--shift)); }
    }
    #controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #mute {
      width: 44px;
      height: 44px;
      margin-left: -8px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #mute svg[hidden] { display: none; }
    #volume {
      width: 234px;
      margin: 0;
      accent-color: #fff;
    }
    /* 試作の確認用パネル（試作が終わったら消す） */
    #debug {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 360px;
      padding: 12px 16px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font: 13px/1.6 system-ui, sans-serif;
    }
    #debug dl { display: grid; grid-template-columns: 80px 1fr; margin: 0 0 8px; }
    #debug dd { margin: 0; overflow-wrap: anywhere; }
    #debug ul { margin: 8px 0 0; padding-left: 16px; max-height: 200px; overflow: auto; font-size: 12px; }
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="dim"></div>

  <div id="panel" hidden>
    <div id="title-box"><a id="title" href="https://www.youtube.com/"></a></div>
    <div id="controls">
      <button id="mute" type="button" aria-label="ミュート解除">
        <svg id="icon-muted" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
        <svg id="icon-sound" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
      </button>
      <input id="volume" type="range" min="0" max="100" value="50" aria-label="音量">
    </div>
  </div>

  <div id="debug">
    <dl>
      <dt>位置</dt><dd id="index">-</dd>
      <dt>音</dt><dd id="muted">-</dd>
      <dt>音量</dt><dd id="volume-value">-</dd>
    </dl>
    <button id="next">次へ</button>
    <ul id="log"></ul>
  </div>

  <script type="module" src="newtab.js"></script>
</body>
</html>
