<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>新しいタブ</title>
  <style>
    :root {
      /* 後でポップアップの設定に置き換える（DESIGN.md 4-4） */
      --blur: 16px;
      --dim: 0.35;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    /* 16:9 の動画で画面を覆う（DESIGN.md 4-2）。ぼかしで端が透けないよう、ぼかしの分だけ大きくする */
    #player iframe {
      position: fixed;
      top: 50%;
      left: 50%;
      width: calc(max(100vw, 100vh * 16 / 9) + var(--blur) * 4);
      height: calc(max(100vh, 100vw * 9 / 16) + var(--blur) * 4);
      transform: translate(-50%, -50%);
      border: 0;
      filter: blur(var(--blur));
      pointer-events: none; /* YouTube のタイトルやボタンを出さない（DESIGN.md 4-3） */
    }
    #dim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, var(--dim));
    }
    /* 試作の確認用パネル（試作が終わったら消す） */
    #debug {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 360px;
      padding: 12px 16px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font: 13px/1.6 system-ui, sans-serif;
    }
    #debug dl { display: grid; grid-template-columns: 80px 1fr; margin: 0 0 8px; }
    #debug dd { margin: 0; overflow-wrap: anywhere; }
    #debug ul { margin: 8px 0 0; padding-left: 16px; max-height: 200px; overflow: auto; font-size: 12px; }
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="dim"></div>

  <div id="debug">
    <dl>
      <dt>動画名</dt><dd id="title">-</dd>
      <dt>位置</dt><dd id="index">-</dd>
      <dt>音</dt><dd id="muted">-</dd>
      <dt>音量</dt><dd id="volume-value">-</dd>
    </dl>
    <button id="unmute">ミュート解除</button>
    <button id="mute">ミュート</button>
    <button id="next">次へ</button>
    <input id="volume" type="range" min="0" max="100" value="50">
    <ul id="log"></ul>
  </div>

  <script type="module" src="newtab.js"></script>
</body>
</html>
